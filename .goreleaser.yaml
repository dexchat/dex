# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: dex

before:
  hooks:
    - go mod tidy

builds:
  - id: dex
    main: ./cmd/dex
    binary: dex
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

nfpms:
  - id: dexchat-deb
    package_name: dexchat
    ids:
      - dex
    formats:
      - deb
      - rpm
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: dexchat
    homepage: https://dexchat.org
    maintainer: Leonardo Essia <leonardo@essia.dev>
    description: A modern and fast terminal IRC client
    license: MIT
    bindir: /usr/bin
    section: net
    priority: optional
    conflicts:
      - dex

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: dex
    repository:
      owner: dexchat
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/dexchat/dex
    description: IRC/TUI client for dexchat
    binaries:
      - dex
    conflicts:
      - cask: dex@tip
    caveats: |
      If macOS blocks dexchat, enable it by running the following command:
      
        xattr -d com.apple.quarantine "$(command -v dex)"

    commit_msg_template: "chore: update dex to {{ .Tag }}"

chocolateys:
  - name: dexchat
    title: dexchat
    owners: dexchat
    authors: Leonardo Essia
    project_url: https://dexchat.org
    project_source_url: https://github.com/dexchat/dex
    package_source_url: https://github.com/dexchat/dex
    docs_url: https://github.com/dexchat/dex/blob/main/README.md
    bug_tracker_url: https://github.com/dexchat/dex/issues
    license_url: https://github.com/dexchat/dex/blob/main/LICENSE
    copyright: 2025 Leonardo Essia
    require_license_acceptance: false
    tags: "irc chat terminal tui cli"
    summary: A modern and fast terminal IRC client
    description: |
      dexchat is a modern and fast TUI IRC client with quick channel jumping, command palettes, and more.

      The package installs the `dex` executable.
    release_notes: "https://github.com/dexchat/dex/releases/tag/{{ .Tag }}"
    # Releases are created as drafts, so the download URLs in the package
    # only work after the draft is published. The Chocolatey workflow pushes
    # the package when that happens.
    skip_publish: true

snapshot:
  version_template: "{{ incpatch .Version }}-next-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  abbrev: 7
  format: "[`{{ .SHA }}`](https://github.com/dexchat/dex/commit/{{ .SHA }}): {{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"

  filters:
    exclude:
      - "^build:"
      - "^ci:"
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^Merge"
      - "^go mod tidy"

  groups:
    - title: "New"
      regexp: "^.*feat(\\([[:word:]-]+\\))?:.*$"
      order: 100

    - title: "Fixed"
      regexp: "^.*fix(\\([[:word:]-]+\\))?:.*$"
      order: 200

    - title: "Refactored"
      regexp: "^.*refactor(\\([[:word:]-]+\\))?:.*$"
      order: 300

    - title: "Documentation"
      regexp: "^.*docs(\\([[:word:]-]+\\))?:.*$"
      order: 400

    - title: "Other changes"
      order: 9999

release:
  draft: true
  footer: |
    ## Full Changelog

    [`{{ .PreviousTag }}...{{ .Tag }}`](https://github.com/dexchat/dex/compare/{{ .PreviousTag }}...{{ .Tag }})

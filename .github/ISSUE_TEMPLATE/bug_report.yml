name: Bug report
description: Something isn't working?
labels: []
assignees: []
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What was supposed to happen?
      placeholder: Tell us what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Screenshots are always welcome.
      placeholder: Drag and drop screenshots here.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, distribution, terminal, multiplexer, and any other relevant details.
      placeholder: |
        Operating system: macOS 15.6
        Terminal: Ghostty 1.1.3
        Multiplexer: tmux 3.5a
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Enter the release version or commit you are using.
      placeholder: v1.2.3 or 1b2c3d4
    validations:
      required: true
